<header class="main-header">
  <div class="utility-bar">
    <div class="container d-flex align-items-center justify-content-between h-100">
      <div class="d-flex align-items-center gap-4">
        <a href="/index.html" class="d-flex align-items-center">
          <img src="/assets/images/icon_coffe.png" alt="Highlands Coffee" style="height: 48px;">
        </a>
        <div class="search-box d-none d-md-flex">
          <span class="material-symbols-outlined text-secondary">search</span>
          <input type="text" id="searchInput" placeholder="Xin chào, bạn cần gì hôm nay?">
        </div>
      </div>

      <div class="d-flex align-items-center gap-3 gap-md-4">
          <div class="d-none d-sm-flex align-items-center gap-2">
            <div class="d-flex align-items-center justify-content-center rounded-circle border border-danger text-danger" style="width: 32px; height: 32px; border-width: 1.8px !important; flex-shrink: 0;">
              <span class="material-symbols-outlined" style="font-size: 18px; color: #b81c24;">call</span>
            </div>
            <div class="lh-sm" style="font-size: 13px; color: #111;">
              <div style="font-weight: 400; color: #111;">Giao tận nơi</div>
              <div style="font-weight: 700; font-size: 14px; color: #000;">19001755</div>
            </div>
          </div>

          <a href="/login.html" class="d-flex align-items-center gap-2 text-dark text-decoration-none">
            <span class="material-symbols-outlined" style="font-size: 34px; color: #b81c24;">account_circle</span>
            <div class="lh-sm d-none d-md-block" style="font-size: 13px; color: #111;">
              <div style="font-weight: 400; color: #111;">Tài khoản</div>
              <div style="font-size: 12px; font-weight: 400; color: #111;">Đăng nhập</div>
            </div>
          </a>

          <button id="openCartBtn" class="d-flex align-items-center gap-2 px-3 py-1" style="background: #ffffff; border: 1.2px solid #b81c24; border-radius: 8px; cursor: pointer;">
            <span class="material-symbols-outlined" style="color: #f0a500; font-size: 21px;">shopping_cart</span>
            <span class="d-none d-sm-inline" style="font-size: 13px; font-weight: 400; color: #111;">Giỏ hàng</span>
            <span id="cartBadgeCount" style="background-color: #ebdcd0; color: #8b1e22; border-radius: 4px; padding: 1px 7px; font-weight: 600; font-size: 13px; min-width: 20px; text-align: center; display: inline-flex; align-items: center; justify-content: center;">0</span>
          </button>
        </div>
    </div>
  </div>
</header>
