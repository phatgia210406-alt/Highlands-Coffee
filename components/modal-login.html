<!-- Modal Login Component -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold text-danger">Đăng Nhập</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label class="form-label font-bold">Email/SĐT</label>
            <input type="text" class="form-control" placeholder="Nhập email hoặc số điện thoại">
          </div>
          <div class="mb-3">
            <label class="form-label font-bold">Mật khẩu</label>
            <input type="password" class="form-control" placeholder="Mật khẩu">
          </div>
          <button type="submit" class="btn btn-highlands w-100 py-2">Đăng Nhập</button>
        </form>
      </div>
    </div>
  </div>
</div>
